[package]
name = "hybit-auto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Adaptive solver policy, algebraic coarse control, and selective-direct escalation for HyBIT"
publish = ["crates-io"]

[features]
default = []
# P2-A research opt-in: a single bounded original-CSR-certified PCG restart
# after a recursively converged solve fails its final independent certificate.
p2-certified-restart = []
# C1-G5C: library-only, research-shadow observation; not an Auto policy.
c1g5c-shadow = []

[dependencies]
hybit-core = { version = "0.10.0", path = "../hybit-core" }
hybit-matrix = { version = "0.10.0", path = "../hybit-matrix" }
hybit-precond = { version = "0.10.0", path = "../hybit-precond" }
hybit-krylov = { version = "0.10.0", path = "../hybit-krylov" }
