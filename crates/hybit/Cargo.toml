[package]
name = "hybit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Autonomous hybrid sparse linear solver with algebraic coarse and adaptive local direct correction"
documentation = "https://docs.rs/hybit"
publish = ["crates-io"]

[features]
default = []
mpi = ["dep:hybit-distributed", "hybit-distributed/mpi", "dep:mpi"]
[dependencies]
hybit-distributed = { version = "0.9.0", path = "../hybit-distributed", optional = true }
mpi = { version = "=0.8.0", default-features = false, optional = true }
hybit-core = { version = "0.9.0", path = "../hybit-core" }
hybit-matrix = { version = "0.9.0", path = "../hybit-matrix" }
hybit-precond = { version = "0.9.0", path = "../hybit-precond" }
hybit-krylov = { version = "0.9.0", path = "../hybit-krylov" }
hybit-auto = { version = "0.9.0", path = "../hybit-auto" }

[[example]]
name = "mpi_smoke"
required-features = ["mpi"]
[[example]]
name = "mpi_halo_spmv"
required-features = ["mpi"]
[[example]]
name = "mpi_overlap_spmv"
required-features = ["mpi"]
[[example]]
name = "mpi_distributed_pcg"
required-features = ["mpi"]
[[example]]
name = "mpi_owned_pcg"
required-features = ["mpi"]
[[example]]
name = "mpi_mtx_pcg"
required-features = ["mpi"]
[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "mpi_mtx_profile"
required-features = ["mpi"]
