[package]
name = "hybit-distributed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "MPI-independent partition and halo topology for HyBIT distributed solvers"
publish = ["crates-io"]

[features]
default = []
mpi = ["dep:mpi"]
[dependencies]
mpi = { version = "=0.8.0", default-features = false, optional = true }
hybit-matrix = { version = "0.9.0", path = "../hybit-matrix" }
[dev-dependencies]
hybit-core = { version = '0.9.0', path = '../hybit-core' }
hybit-krylov = { version = '0.9.0', path = '../hybit-krylov' }
