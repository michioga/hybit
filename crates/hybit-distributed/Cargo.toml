[package]
name = "hybit-distributed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "MPI-independent partition and halo topology for HyBIT distributed solvers"
publish = ["crates-io"]

[features]
default = []
mpi = ["dep:mpi"]
[dependencies]
mpi = { version = "=0.8.0", default-features = false, optional = true }
hybit-matrix = { version = "0.9.0", path = "../hybit-matrix" }
[[example]]
name = "mpi_field_aware_halo"
required-features = ["mpi"]

[[example]]
name = "mpi_field_partition_compare"
required-features = ["mpi"]

[[example]]
name = "mpi_field_mtx_bench"
required-features = ["mpi"]

[dev-dependencies]
hybit-core = { version = '0.9.0', path = '../hybit-core' }
hybit-krylov = { version = '0.9.0', path = '../hybit-krylov' }

[[example]]
name = "cost_field_partition_probe"

[[example]]
name = "mpi_cost_guard_smoke"
required-features = ["mpi"]

[[example]]
name = "mpi_root_cost_partition_smoke"
required-features = ["mpi"]

[[example]]
name = "mpi_root_graph_selection_bench"
required-features = ["mpi"]

[[example]]
name = "mpi_root_measured_calibration_bench"
required-features = ["mpi"]
