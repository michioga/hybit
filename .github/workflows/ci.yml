name: CI

on:
  push:
    branches: [main, develop/0.7.0, develop/0.8.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Rust ${{ matrix.rust }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: windows-latest
            rust: stable
          - os: ubuntu-latest
            rust: 1.73.0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Test workspace
        run: cargo test --workspace --release
      - name: Build facade examples
        run: cargo build --release -p hybit --examples

  docs:
    name: mdBook
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: "0.5.4"
      MDBOOK_SHA256: "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7"
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned mdBook
        shell: bash
        run: |
          set -euo pipefail
          archive="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/${archive}"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --proto '=https' --tlsv1.2 -o "/tmp/${archive}" "$url"
          echo "${MDBOOK_SHA256}  /tmp/${archive}" | sha256sum --check --strict
          tar -xzf "/tmp/${archive}" -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build documentation
        run: mdbook build
  package:
    name: Package metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check workspace metadata
        run: cargo metadata --format-version 1 --no-deps > /dev/null
      - name: Check package contents
        shell: bash
        run: |
          set -euo pipefail
          for crate in hybit-core hybit-matrix hybit-krylov hybit-precond hybit-auto hybit; do
            echo "== $crate =="
            cargo package -p "$crate" --list
          done
