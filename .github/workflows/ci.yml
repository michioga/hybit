name: CI

on:
  push:
    branches: [main, develop/0.6.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Rust ${{ matrix.rust }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: windows-latest
            rust: stable
          - os: ubuntu-latest
            rust: 1.73.0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Test workspace
        run: cargo test --workspace --release
      - name: Build facade examples
        run: cargo build --release -p hybit --examples

  package:
    name: Package metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check workspace metadata
        run: cargo metadata --format-version 1 --no-deps > /dev/null
      - name: Check package contents
        shell: bash
        run: |
          set -euo pipefail
          for crate in hybit-core hybit-matrix hybit-krylov hybit-precond hybit-auto hybit; do
            echo "== $crate =="
            cargo package -p "$crate" --list
          done
