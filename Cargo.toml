[workspace]
resolver = "3"
members = [
    "crates/hybit-core",
    "crates/hybit-matrix",
    "crates/hybit-distributed",
    "crates/hybit-precond",
    "crates/hybit-krylov",
    "crates/hybit-auto",
    "crates/hybit",
    "crates/hybit-ffi",
]
default-members = ["crates/hybit"]

[workspace.package]
version = "0.10.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
authors = ["HyBIT contributors"]
repository = "https://github.com/michioga/hybit"
readme = "README.md"
keywords = ["sparse", "solver", "linear-algebra", "fem", "hpc"]
categories = ["algorithms", "mathematics", "science"]

[profile.release]
lto = "thin"
codegen-units = 1
